[build-system]
requires = ["uv_build>=0.13.10,<0.14"]
build-backend = "uv_build"

[project]
name = "llamaindex-foundational-retrieval"
version = "0.2.1"
description = "Llamaindex foundational retrieval system"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.8",
    "datasets>=4.8.4",
    "docling>=2.94.0",
    "docx2txt>=0.9",
    "huggingface-hub>=1.10.0",
    "ipykernel",
    "ipywidgets",
    "langchain-community>=0.4.1",
    "langchain-core>=1.3.2",
    "langchain-text-splitters>=1.1.2",
    "llama-index>=0.14.20",
    "llama-index-embeddings-huggingface>=0.7.0",
    "llama-index-readers-file>=0.6.0",
    "llama-index-readers-huggingface-fs>=0.5.0",
    "llama-index-vector-stores-milvus>=1.1.0",
    "llama-index-vector-stores-neo4jvector>=0.7.0",
    "mcp>=2.2.0",
    "milvus-lite==2.5.2rc1",
    "numpy>=2.4.4",
    "ollama>=0.6.2",
    "pip>=26.0.1",
    "pymilvus>=2.6.12",
    "sentence-transformers>=5.4.1",
    "tqdm>=4.67.3",
    "transformers>=5.5.4",
    "unstructured[all-docs]>=0.17.0",
]

[tool.uv.build-backend]
module-name = ["data", "mcp_server", "models", "pipeline"]
module-root = ""
